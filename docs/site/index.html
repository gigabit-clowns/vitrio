<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vitrio</title>
<style>
	:root {
		--bg: #ffffff;
		--fg: #1b1f24;
		--muted: #57606a;
		--border: #d0d7de;
		--accent: #0b5cad;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0d1117;
			--fg: #e6edf3;
			--muted: #9198a1;
			--border: #30363d;
			--accent: #58a6ff;
		}
	}
	body {
		margin: 0;
		background: var(--bg);
		color: var(--fg);
		font: 16px/1.5 system-ui, sans-serif;
	}
	main {
		max-width: 40rem;
		margin: 0 auto;
		padding: 4rem 1rem;
	}
	h1 { margin: 0 0 0.5rem; }
	p { color: var(--muted); }
	ul { list-style: none; padding: 0; margin: 2rem 0; }
	li a {
		display: block;
		padding: 1rem 1.25rem;
		margin-bottom: 0.75rem;
		border: 1px solid var(--border);
		border-radius: 0.5rem;
		color: var(--accent);
		text-decoration: none;
		font-weight: 600;
	}
	li a span {
		display: block;
		color: var(--muted);
		font-weight: 400;
	}
	li a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
	<h1>vitrio</h1>
	<p>
		High-throughput image I/O for Cryo-Electron Microscopy (CryoEM)
	</p>
	<ul>
		<li>
			<a href="python/">
				Python reference
				<span>The package, from its docstrings.</span>
			</a>
		</li>
		<li>
			<a href="cpp/">
				C++ reference
				<span>The public headers, with the README as its first page.</span>
			</a>
		</li>
		<li>
			<a href="https://github.com/gigabit-clowns/vitrio">
				Source and examples
				<span>On GitHub.</span>
			</a>
		</li>
	</ul>
</main>
</body>
</html>
