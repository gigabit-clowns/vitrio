name: Build and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - LICENSE
      - '**.md'
      - .clang-tidy
      - .editorconfig
      - .gitignore
      - renovate.json

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each job builds the Python package too and runs its tests. One of them
  # has the oldest Python the package supports.
  build-and-test:
    name: ${{ matrix.os }}, ${{ matrix.cxx }}, Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            python: '3.10'
          - os: ubuntu-latest
            cxx: clang++
            python: '3.14'
          - os: macos-latest
            cxx: clang++
            python: '3.14'
          - os: windows-latest
            cxx: cl
            python: '3.14'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          key: ${{ matrix.os }}-${{ matrix.cxx }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # A group of pyproject.toml is installed by pip 25.1 and newer.
      - name: Install what the Python package is built and tested with
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      # The Visual Studio generator chooses its own compiler, so CXX is left
      # empty on Windows.
      - name: Configure
        env:
          CXX: ${{ runner.os != 'Windows' && matrix.cxx || '' }}
        run: cmake --preset debug -DVITRIO_BUILD_PYTHON=ON

      - name: Build
        run: cmake --build --preset debug --parallel 4

      - name: Test
        run: ctest --preset debug

  sanitize:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Address and undefined behaviour sanitizers
            preset: sanitize
          - name: Thread sanitizer
            preset: sanitize-thread
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          key: ubuntu-latest-clang++

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Says what changed in the ABI since the last release, by building that
  # release beside this tree and comparing the two libraries. A change does
  # not fail it: before 1.0 a release may break the ABI, and this tells
  # which kind of release the next one has to be.
  abi:
    name: ABI since the last release
    runs-on: ubuntu-latest
    env:
      CXX: g++
    steps:
      - name: Check out the repository, with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          key: ubuntu-latest-g++

      - name: Install libabigail
        run: sudo apt-get update && sudo apt-get install --yes abigail-tools

      - name: Check out the last release beside this tree
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git worktree add "$RUNNER_TEMP/release" "$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build both
        run: |
          for tree in . "$RUNNER_TEMP/release"; do
            cmake -S "$tree" --preset debug \
              -DVITRIO_BUILD_TESTING=OFF -DVITRIO_CHECK_HEADERS=OFF
            cmake --build "$tree/build/debug" --parallel 4
          done

      # The first two bits of what abidiff returns say that it could not
      # compare, and those do fail the job. The next two say whether the ABI
      # changed, and whether it did so in a way that breaks what was built
      # against the release.
      - name: Compare
        run: |
          status=0
          abidiff \
            --headers-dir1 "$RUNNER_TEMP/release/include" \
            --headers-dir2 include \
            "$RUNNER_TEMP/release/build/debug/src/libvitrio.so" \
            build/debug/src/libvitrio.so > abi.txt || status=$?
          if [ $((status & 3)) -ne 0 ]; then
            verdict="The ABI could not be compared with that of $RELEASE_TAG."
          elif [ $((status & 8)) -ne 0 ]; then
            verdict="The ABI changed, and what was built against $RELEASE_TAG breaks."
          elif [ $((status & 4)) -ne 0 ]; then
            verdict="The ABI changed, and what was built against $RELEASE_TAG still works."
          else
            verdict="The ABI is that of $RELEASE_TAG."
          fi
          {
            echo "## $verdict"
            echo
            echo '```'
            cat abi.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $((status & 3))

  # The presets need CMake 3.21, so this is the one job that does without
  # them, and the one that holds cmake_minimum_required to its word.
  minimum-cmake:
    name: CMake 3.18
    runs-on: ubuntu-latest
    env:
      CXX: g++
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          key: ubuntu-latest-g++

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      # A group of pyproject.toml is installed by pip 25.1 and newer.
      - name: Install what the Python package is built and tested with
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: Install CMake 3.18
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --quiet cmake==3.18.0
          "$RUNNER_TEMP/cmake/bin/cmake" --version

      - name: Configure
        run: >-
          "$RUNNER_TEMP/cmake/bin/cmake" -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE"
          -DVITRIO_CHECK_HEADERS=ON
          -DVITRIO_BUILD_PYTHON=ON

      - name: Build
        run: >-
          "$RUNNER_TEMP/cmake/bin/cmake" --build build --parallel 4

      - name: Test
        working-directory: build
        run: >-
          "$RUNNER_TEMP/cmake/bin/ctest" --output-on-failure

      - name: Install
        run: >-
          "$RUNNER_TEMP/cmake/bin/cmake" --install build
          --prefix "$RUNNER_TEMP/install"
