# SPDX-License-Identifier: LGPL-2.1-or-later

name: Release

# Builds what is published to PyPI: the source distribution, and from it a
# wheel for each platform. A tag publishes them. Otherwise it runs when what
# decides how they are built changes, or by hand.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - pyproject.toml
      - vcpkg.json
      - .github/workflows/release.yml
      - .github/actions/setup-vcpkg/**

  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
      - vcpkg.json
      - .github/workflows/release.yml
      - .github/actions/setup-vcpkg/**

  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Build the source distribution
        run: |
          python -m pip install --group sdist
          python -m build --sdist

      - name: Keep the source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The wheels are built from the source distribution and not from the
  # checkout, so that what is published is known to build.
  wheels:
    name: Wheels, ${{ matrix.os }}
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          key: wheels-${{ matrix.os }}

      - name: Fetch the source distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Find the source distribution
        id: sdist
        run: echo "path=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse

      - name: Keep the wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # PyPI trusts this workflow in this repository, so no token is kept.
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - sdist
      - wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vitrio/
    permissions:
      id-token: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
