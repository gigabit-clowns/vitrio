# SPDX-License-Identifier: LGPL-2.1-or-later

name: Documentation

# Builds the documentation of the API, which is two references: that of the
# C++ headers, by Doxygen, and that of the Python package, by Sphinx, from
# the docstrings of the package built here. They are published together,
# under /cpp/ and /python/ of one site with a page of its own at the root.
# What breaks either is seen when it is pushed, and a tag publishes them to
# GitHub Pages.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - LICENSE
      - .clang-tidy
      - .editorconfig
      - .gitignore
      - renovate.json

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CXX: g++
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Doxygen, and Graphviz for its diagrams
        run: sudo apt-get update && sudo apt-get install --yes doxygen graphviz

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # A group of pyproject.toml is installed by pip 25.1 and newer.
      - name: Install what the reference of the Python package is built with
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group docs

      # The project is configured as a whole, and that fetches what the
      # library is built with. The Python reference imports the package, so
      # the library and the extension are compiled for it.
      - name: Configure
        run: >-
          cmake --preset debug
          -DVITRIO_BUILD_DOCS=ON
          -DVITRIO_BUILD_PYTHON=ON
          -DVITRIO_BUILD_TESTING=OFF
          -DVITRIO_CHECK_HEADERS=OFF

      - name: Build the documentation of the C++ API
        run: cmake --build --preset debug --target vitrio-docs

      - name: Build the documentation of the Python package
        run: cmake --build --preset debug --parallel 4 --target vitrio-python-docs

      - name: Put the two references together
        run: |
          mkdir site
          cp docs/index.html site/index.html
          cp -r build/debug/docs/doxygen/html site/cpp
          cp -r build/debug/docs/sphinx/html site/python
          touch site/.nojekyll

      - name: Set up Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Keep the documentation for Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    name: Publish to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
